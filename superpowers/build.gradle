plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

base {
	archivesName = project.name
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"superpowers" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			// Dev-only automated smoke test: creates a world, cycles every power and takes screenshots.
			if (project.hasProperty("autotest")) {
				vmArg "-Dsuperpowers.autotest=" + project.property("autotest")
			}
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// Production smoke test: runs the remapped jar exactly as a launcher would.
// ./gradlew prodClient -PfabricApiJar=<path to fabric-api jar> -Pautotest=fire
tasks.register("prodClient", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	mods.from(remapJar)
	if (project.hasProperty("fabricApiJar")) {
		mods.from(file(project.property("fabricApiJar")))
	}
	jvmArgs.add("-Dsuperpowers.autotest=" + (project.findProperty("autotest") ?: "1"))
	runDir = file("prodrun")
}
